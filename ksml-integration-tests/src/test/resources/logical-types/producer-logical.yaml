functions:
  generate_logical_message:
    type: generator
    globalCode: |
      import time
      counter = 0
    code: |
      global counter
      key = "sensor" + str(counter)
      counter = (counter + 1) % 10
      value = {
        "name": key,
        "id": "123e4567-e89b-12d3-a456-426614174000",   # uuid logical type, as a string
        "amount": "123.45",                              # decimal(10,2), as a canonical string
        "eventDate": 19785,                              # date, days since epoch
        "eventTimeMillis": 3723000,                      # time-millis, 01:02:03
        "eventTimestamp": round(time.time() * 1000)      # timestamp-millis
      }
    expression: (key, value)
    resultType: (string, json)

producers:
  logical_data_producer:
    generator: generate_logical_message
    interval: 3s
    to:
      topic: logical_data_avro
      keyType: string
      valueType: avro:LogicalData
