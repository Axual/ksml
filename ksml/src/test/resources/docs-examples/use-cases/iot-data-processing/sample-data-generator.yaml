# $schema: https://raw.githubusercontent.com/Axual/ksml/refs/heads/main/docs/ksml-language-spec.json

streams:
  sensor_readings:
    topic: iot_sensor_readings
    keyType: string  # device_id
    valueType: json  # sensor data

functions:
  generate_sensor_reading:
    type: generic
    resultType: boolean
    expression: False
    globalCode: |
      import random
      import time
      
      # Static data
      rooms = ["conference-a", "conference-b", "conference-c"]
      # Room coordinates, at different distances from the building entrance used in processing-geospatial-data.yaml
      room_coordinates = {
        "conference-a": {"lat": 52.0908, "lng": 5.1068},  # about 60 meters from the entrance
        "conference-b": {"lat": 52.0915, "lng": 5.1085},  # about 200 meters from the entrance
        "conference-c": {"lat": 52.0930, "lng": 5.1110}   # about 440 meters from the entrance
      }
      device_types = ["temperature_sensor", "energy_meter"]
      
      # Counter for generating unique device IDs
      global counter
      counter = 0
      
      def generate_reading():
        global counter
        counter += 1
        
        # Select room and device type
        room = rooms[counter % len(rooms)]
        device_type = device_types[counter % len(device_types)]
        device_id = f"{device_type}-{room}"
        
        # Generate random readings, generate an out-of-range temperature every 50 readings
        # (8.0 and 32.0 give a warning alert, 4.0 and 36.0 a critical alert)
        if counter % 50 == 0:
          temperature = random.choice([4.0, 8.0, 32.0, 36.0])
        else:
          temperature = round(random.uniform(19.0, 24.0), 1)
        
        humidity = round(random.uniform(40.0, 70.0), 1)
        energy = random.randint(50, 150)
        
        # Create sensor reading
        reading = {
          "device_id": device_id,
          "timestamp": int(time.time() * 1000),
          "device_type": device_type,
          "location": {
            "building": "headquarters",
            "floor": 3,
            "room": room,
            "coordinates": room_coordinates[room]
          },
          "readings": {
            "temperature": temperature,
            "humidity": humidity,
            "energy": energy
          },
          "battery_level": random.randint(17, 100),
          "status": "active"
        }
        
        return reading

producers:
  iot_sensor_producer:
    to: sensor_readings
    interval: 1000  # Generate every second
    generator:
      code: |
        reading = generate_reading()
      expression: '(reading.get("device_id"), reading)'
      resultType: (string, json)