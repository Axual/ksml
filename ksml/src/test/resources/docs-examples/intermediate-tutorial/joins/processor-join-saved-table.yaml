streams:
  orders:
    topic: new_orders
    keyType: string  # Order ID
    valueType: json  # Order details

  enriched_orders:
    topic: orders_with_customer_loyalty
    keyType: string  # Order ID
    valueType: json  # Order with customer and loyalty data

tables:
  customers:
    topic: customer_data
    keyType: string  # Customer ID
    valueType: json  # Customer details

  loyalty:
    topic: customer_loyalty
    keyType: string  # Customer ID
    valueType: json  # Loyalty tier and points

functions:
  join_customer_with_loyalty:
    type: valueJoiner
    code: |
      # Add the loyalty record to the customer details
      result = dict(value1)
      result["loyalty"] = value2
    expression: result
    resultType: json

  extract_customer_id:
    type: keyTransformer
    code: |
      # Extract customer_id from order to use as key for join
      new_key = value.get("customer_id") if value else None
    expression: new_key
    resultType: string

  join_order_with_customer:
    type: valueJoiner
    code: |
      # Add the customer, with its loyalty record, to the order
      result = dict(value1)
      result["customer"] = value2
    expression: result
    resultType: json

  restore_order_key:
    type: keyTransformer
    code: |
      # Restore order_id as key after join
      new_key = value.get("order_id") if value else None
    expression: new_key
    resultType: string

pipelines:
  # Stage 1: join the customers table with the loyalty table and save the result
  enrich_customers:
    from: customers
    via:
      - type: join
        table: loyalty
        valueJoiner: join_customer_with_loyalty
    as: customers_with_loyalty

  # Stage 2: join each order with the table saved by stage 1
  enrich_orders:
    from: orders
    via:
      # Rekey to customer_id for join
      - type: transformKey
        mapper: extract_customer_id
      # Join with the table saved with "as" by the pipeline above
      - type: join
        table: customers_with_loyalty
        valueJoiner: join_order_with_customer
      # Rekey back to order_id
      - type: transformKey
        mapper: restore_order_key
      - type: peek
        forEach:
          code: log.info("ENRICHED ORDER - key={}, customer={}, tier={}", key, value["customer"]["name"], value["customer"]["loyalty"]["tier"])
    to: enriched_orders
