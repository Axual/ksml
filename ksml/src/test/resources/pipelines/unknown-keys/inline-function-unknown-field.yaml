# Test definition for unknown-field validation, see UnknownFieldsTest
streams:
  clicks:
    topic: clicks_in
    keyType: string
    valueType: string
  counts:
    topic: counts_out
    keyType: string
    valueType: long

pipelines:
  filtered:
    from: clicks
    via:
      - type: filter
        if:
          expression: key is not None
          resultTyp: boolean  # should be "resultType"
    to: counts
