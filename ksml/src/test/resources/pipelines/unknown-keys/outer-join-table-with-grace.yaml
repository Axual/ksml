# Test definition for unknown-field validation, see UnknownFieldsTest
streams:
  orders:
    topic: orders
    keyType: string
    valueType: string
  payments:
    topic: payments
    keyType: string
    valueType: string
  joined:
    topic: joined
    keyType: string
    valueType: string

tables:
  notes:
    topic: notes
    keyType: string
    valueType: string

globalTables:
  customers:
    topic: customers
    keyType: string
    valueType: string

pipelines:
  joining:
    from: orders
    via:
      - type: outerJoin
        table: notes
        valueJoiner:
          resultType: string
          expression: str(value1) + "|" + str(value2)
        grace: 1s               # not for an outerJoin with a table
    to: joined
