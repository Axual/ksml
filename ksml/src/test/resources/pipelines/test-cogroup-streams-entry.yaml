# "stream: refunds" names an entry under "streams:", like in merge and join. Cogroup needs a grouped stream saved with
# "as" instead.
streams:
  orders:
    topic: customer_orders
    keyType: string
    valueType: json

  refunds:
    topic: customer_refunds
    keyType: string
    valueType: json

functions:
  init_total:
    type: initializer
    expression: 0.0
    resultType: double

  add_order:
    type: aggregator
    expression: aggregatedValue + value.get("amount", 0)
    resultType: double

  add_refund:
    type: aggregator
    expression: aggregatedValue - value.get("amount", 0)
    resultType: double

pipelines:
  customer_totals:
    from: orders
    via:
      - type: groupByKey
      - type: cogroup
        aggregator: add_order
      - type: cogroup
        stream: refunds
        aggregator: add_refund
      - type: aggregate
        initializer: init_total
        store:
          name: customer_totals_store
          type: keyValue
      - type: toStream
    to:
      topic: customer_totals
      keyType: string
      valueType: double
