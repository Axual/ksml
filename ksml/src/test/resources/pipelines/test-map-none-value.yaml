# A (key, None) result of map is a tombstone, so the count after it skips it.

streams:
  orders:
    topic: json_input_topic
    keyType: string
    valueType: json
  counts:
    topic: count_topic
    keyType: string
    valueType: long

pipelines:
  count_orders:
    from: orders
    via:
      - type: map
        mapper:
          expression: (key, value if value["amount"] > 0 else None)
          resultType: (string, json)
      - type: groupByKey
      - type: count
      - type: toStream
    to: counts
