# $schema: https://raw.githubusercontent.com/Axual/ksml/refs/heads/main/docs/ksml-language-spec.json

# A streamPartitioner can read the record headers. Kafka drops a record when the partitioner
# returns an empty list of partitions, so only records without the header route=drop come out.

streams:
  events:
    topic: events
    keyType: string
    valueType: string
  routedEvents:
    topic: routedEvents
    keyType: string
    valueType: string

functions:
  route_by_header:
    type: streamPartitioner
    code: |
      route = None
      for header in headers:
        if header["key"] == "route":
          route = header["value"]
    expression: "[] if route == 'drop' else [0]"
    resultType: "[integer]"

pipelines:
  route_events:
    from: events
    to:
      topic: routedEvents
      keyType: string
      valueType: string
      partitioner: route_by_header
