streams:
  sensors:
    topic: ksml_sensordata_avro
    keyType: string
    valueType: avro:SensorData
  counts:
    topic: output_topic
    keyType: string
    valueType: long

pipelines:
  count_sensors:
    from: sensors
    via:
      - type: groupByKey
      - type: count
      - type: toStream
    to: counts
