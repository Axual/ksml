# The pipeline saves its result with "as: orders", but "orders" is already defined under "tables".
# KSML only logs a warning: a later "from: orders" gets the saved result, joins and merges get the table.
streams:
  order_events:
    topic: order_events
    keyType: string
    valueType: json

tables:
  orders:
    topic: orders
    keyType: string
    valueType: json

pipelines:
  latest_orders:
    from: order_events
    via:
      - type: toTable
    as: orders
