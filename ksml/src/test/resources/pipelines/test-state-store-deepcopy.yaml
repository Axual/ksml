# $schema: https://raw.githubusercontent.com/Axual/ksml/refs/heads/main/docs/ksml-language-spec.json

# Checks that copy.deepcopy() works on a value read back from a key/value store, through a real
# running topology. See notes/2026-09-09-1703-state-store-deepcopy-check.md.
streams:
  sensor_source_avro:
    topic: ksml_sensordata_avro
    keyType: string
    valueType: avro:SensorData

stores:
  last_sensor_data_store:
    type: keyValue
    keyType: string
    valueType: json
    persistent: false
    historyRetention: 1h
    caching: false
    logging: false

functions:
  process_message:
    type: forEach
    globalCode: |
      import copy
    code: |
      last_value = last_sensor_data_store.get(key)
      if last_value != None:
        backup = copy.deepcopy(last_value)
        log.info("Deep-copied last value for key {}: {}", key, backup)
      last_sensor_data_store.put(key, value)
    stores:
      - last_sensor_data_store

pipelines:
  process_message:
    from: sensor_source_avro
    forEach: process_message
