tables:
  users:
    topic: t_users
    keyType: string
    valueType: json

streams:
  out_count:
    topic: out_count
    keyType: string
    valueType: long

pipelines:
  count_per_region:
    from: users
    via:
      - type: groupBy
        mapper:
          resultType: tuple(string, json)
          expression: '(value["region"], value)'
      - type: count
      - type: toStream
    to: out_count
