streams:
  input:
    topic: in
    keyType: string
    valueType: json
  output:
    topic: out
    keyType: string
    valueType: json

pipelines:
  main:
    from: input
    via:
      - type: map
        mapper:
          resultType: tuple(string, json)
          expression: '(value.get("user") if value is not None else None, {"orig": key})'
    to: output
