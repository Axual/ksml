streams:
  input:
    topic: in
    keyType: string
    valueType: json
  output:
    topic: out
    keyType: string
    valueType: json

stores:
  table_store:
    type: keyValue
    keyType: string
    valueType: json

pipelines:
  main:
    from: input
    via:
      - type: toTable
        store: table_store
      - type: toStream
    to: output
