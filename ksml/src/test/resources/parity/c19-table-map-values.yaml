tables:
  input:
    topic: t_in
    keyType: string
    valueType: json

streams:
  output:
    topic: out
    keyType: string
    valueType: json

pipelines:
  main:
    from: input
    via:
      - type: mapValues
        mapper:
          resultType: json
          expression: 'None if value is None else {"double": value["amount"] * 2}'
      - type: toStream
    to: output
