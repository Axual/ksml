streams:
  input:
    topic: in
    keyType: string
    valueType: json
  output:
    topic: out
    keyType: string
    valueType: json

pipelines:
  main:
    from: input
    via:
      - type: groupByKey
      - type: windowByTime
        windowType: tumbling
        duration: 10s
      - type: count
      - type: toStream
    to: output
