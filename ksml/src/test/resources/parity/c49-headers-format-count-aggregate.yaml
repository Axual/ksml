# Run with dsl.store.format=HEADERS (Kafka 4.3, KIP-1285): count without a store, aggregate with a declared store
streams:
  input:
    topic: in
    keyType: string
    valueType: json
  out_count:
    topic: out_count
    keyType: string
    valueType: long
  out_sum:
    topic: out_sum
    keyType: string
    valueType: json

stores:
  sum_store:
    type: keyValue
    keyType: string
    valueType: json
    persistent: true
    logging: true
    timestamped: true

pipelines:
  counting:
    from: input
    via:
      - type: groupByKey
      - type: count
      - type: toStream
    to: out_count
  summing:
    from: input
    via:
      - type: groupByKey
      - type: aggregate
        store: sum_store
        initializer:
          expression: '{"sum": 0}'
          resultType: json
        aggregator:
          expression: '{"sum": aggregatedValue["sum"] + value["amount"]}'
          resultType: json
      - type: toStream
    to: out_sum
