streams:
  input:
    topic: in
    keyType: string
    valueType: json
  output:
    topic: out
    keyType: string
    valueType: json

pipelines:
  main:
    from: input
    via:
      - type: groupByKey
      - type: reduce
        reducer:
          resultType: json
          expression: '{"amount": value1["amount"] + value2["amount"]}'
      - type: toStream
    to: output
