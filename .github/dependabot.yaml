# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Keep a "groups" block on every ecosystem. Without one, every package gets its
# own pull request.
#
# Do not add "update-types" to split majors into their own group. Groups match
# on "patterns" only, so the second group stays empty and majors can be dropped
# with no warning. See dependabot-core #13665 and #14202. Majors are batched
# with the rest; use "ignore" for one we do not want.
#
# Security updates ignore "schedule" and are still raised right away.

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      dev-deps:
        dependency-type: "development"
      prod-deps:
        dependency-type: "production"
    ignore:
      # All GraalVM library bumps past 25.0.x are blocked on purpose, with no upper
      # end to the range. Do not narrow this range without reading
      # developerdocs/graalvm-version-pinning.md first - it explains a second,
      # deeper problem found in GraalVM 25.3.4.1 (PR #701) on top of the original
      # GraalPy 25.1/25.2 native-extension bug (#688), and what needs to be true
      # before it is safe to widen this again.
      - dependency-name: "org.graalvm.*:*"
        versions: [ ">=25.1.0" ]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      # Allow both direct and indirect updates for all packages
      - dependency-type: "all"
    groups:
      python-deps:
        patterns: [ "*" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns: [ "*" ]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns: [ "*" ]
