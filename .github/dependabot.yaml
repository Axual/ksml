# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Keep a "groups" block on every ecosystem. Without one, every package gets its
# own pull request.
#
# Do not add "update-types" to split majors into their own group. Groups match
# on "patterns" only, so the second group stays empty and majors can be dropped
# with no warning. See dependabot-core #13665 and #14202. Majors are batched
# with the rest; use "ignore" for one we do not want.
#
# Security updates ignore "schedule" and are still raised right away.

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      dev-deps:
        dependency-type: "development"
      prod-deps:
        dependency-type: "production"
    ignore:
      # GraalPy 25.1 and 25.2 cannot load Python C extension modules such as
      # _ctypes, which PythonContextTest.testNativeAccess catches (see #688).
      # Fixed upstream by https://github.com/oracle/graalpython/pull/1018, but
      # we do not know if that reached 25.2.5, so the range stops there and
      # Dependabot may offer it once it exists. These jars are only half of
      # GraalVM: going past 25.0.x also needs GRAALVM_JDK_VERSION bumped in the
      # workflows, or polyglot's version check quietly drops Python to the
      # slow interpreter.
      - dependency-name: "org.graalvm.*:*"
        versions: [ ">=25.1.0, <25.2.5" ]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      # Allow both direct and indirect updates for all packages
      - dependency-type: "all"
    groups:
      python-deps:
        patterns: [ "*" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns: [ "*" ]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns: [ "*" ]
