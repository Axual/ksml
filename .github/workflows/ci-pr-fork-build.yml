name: CI - Fork PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: fork-build-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v7

      # Fork PRs skip build-and-test.yml, whose docker-build-test job is the only
      # place on that path that fetches these tarballs. Runs before the build so a
      # bad version fails in seconds instead of after the merge.
      - name: Check GraalVM JDK tarballs exist
        run: scripts/graalvm-tarballs.sh check

      # Same JVM the Docker image ships, from the same single source. Note "graalvm"
      # would be Oracle GraalVM, a different product under a different licence.
      - name: Read GraalVM version
        id: graalvm
        run: echo "version=$(cat .graalvm-jdk-version)" >> "$GITHUB_OUTPUT"

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: graalvm-community
          java-version: ${{ steps.graalvm.outputs.version }}
          cache: maven

      - name: Build and test
        timeout-minutes: 60
        run: mvn -T1C clean verify -DskipITs=false --no-transfer-progress
        env:
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Save PR metadata
        env:
          REPO_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p pr-metadata
          printf '%s' "$REPO_NAME" > pr-metadata/repo-name
          printf '%s' "$HEAD_REF"  > pr-metadata/head-ref
          printf '%s' "$HEAD_SHA"  > pr-metadata/head-sha
          printf '%s' "$PR_NUMBER" > pr-metadata/pr-number
          printf '%s' "$BASE_REF"  > pr-metadata/base-ref

      - name: Upload Sonar inputs
        uses: actions/upload-artifact@v7
        with:
          name: sonar-inputs-${{ github.event.pull_request.head.sha }}
          retention-days: 1
          path: |
            pr-metadata/
            ksml-reporting/target/site/jacoco-aggregate/jacoco.xml
            **/target/classes/
            **/target/generated-sources/
            **/target/failsafe-reports/
            **/src/main/java/
            **/src/test/java/
