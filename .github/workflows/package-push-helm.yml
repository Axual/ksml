name: Package and Push Helm Chart
on:
  workflow_dispatch:
    inputs:
      app-version:
        required: true
        type: string
        description: "The app version that should be set in the chart"
      version:
        required: false
        default: 0.0.0-snapshot
        type: string
        description: "The version of the chart to be released"
  workflow_call:
    inputs:
      app-version:
        required: true
        type: string
      version:
        required: false
        default: 0.0.0-snapshot
        type: string

jobs:
  build-push-helm:
    runs-on: ubuntu-latest
    steps:
      # Helm is preinstalled on the runner image
      - name: Show Helm version
        shell: bash
        run: |
          helm version

      - name: Checkout
        uses: actions/checkout@v7

      - name: Package Helm
        shell: bash
        run: |
          helm package --version '${{ inputs.version }}' --app-version '${{ inputs.app-version }}' ./packaging/helm-charts/ksml && ls ksml*.tgz

      # Registry login and logout take the registry host only, not the repository path
      - name: Login to registry
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.AXUAL_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.AXUAL_REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login registry.axual.io -u "$REGISTRY_USER" --password-stdin

      - name: Push to registry
        shell: bash
        run: |
          helm push 'ksml-${{ inputs.version }}.tgz' oci://registry.axual.io/opensource/charts

      - name: Log out of registry
        shell: bash
        if: ${{ always() }}

        run: |
          helm registry logout registry.axual.io &
