name: "Produce block with advanceWallClockTime as a plain number of milliseconds"
definition: pipelines/test-passthrough.yaml

streams:
  input:
    topic: input_topic
    keyType: string
    valueType: string
  output:
    topic: output_topic
    keyType: string
    valueType: string

tests:
  millis_time_step:
    produce:
      - to: input
        advanceWallClockTime: 500
    assert:
      - on: output
        code: |
          assert len(records) == 0
